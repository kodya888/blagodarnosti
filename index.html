<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Дневник благодарности — записи хороших моментов">
  <title>Благодарности</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Экран входа -->
  <section id="auth-screen" class="screen" hidden>
    <div class="auth-box">
      <h1>Благодарности</h1>
      <p class="subtitle">Дневник благодарности и хороших моментов</p>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="E-mail" autocomplete="email" required>
        <input type="password" id="auth-password" placeholder="Пароль" autocomplete="current-password" required>
        <button type="submit" id="auth-submit" class="btn btn-primary">Войти</button>
      </form>
      <p id="auth-error" class="error" hidden></p>
      <p class="hint">Вход только для владельца. Аккаунт создаётся один раз при первом входе.</p>
    </div>
  </section>

  <!-- Основное приложение -->
  <main id="app-screen" class="screen" hidden>

    <!-- Экран 1: новая запись -->
    <section id="entry-screen" class="page">
      <header class="page-header">
        <h2 id="today-date">Сегодня</h2>
      </header>
      <div class="entry-card">
        <textarea id="entry-text" placeholder="За что вы благодарны сегодня? Хороший момент…" maxlength="2000" rows="6"></textarea>
        <div class="entry-footer">
          <span id="char-counter" class="counter">0 / 2000</span>
          <button id="save-btn" class="btn btn-primary">Сохранить</button>
        </div>
      </div>
      <p id="entry-toast" class="toast" hidden>Сохранено ✓</p>
      <p id="sync-badge" class="sync-badge" hidden></p>
    </section>

    <!-- Экран 2: список записей -->
    <section id="list-screen" class="page" hidden>
      <header class="page-header">
        <h2>Записи</h2>
        <button id="export-btn" class="export-btn" aria-label="Экспорт в файл">Экспорт</button>
        <span id="entries-count" class="counter"></span>
      </header>
      <input type="search" id="search-input" placeholder="Поиск по слову…" autocomplete="off">
      <div id="entries-list" class="entries-list"></div>
      <p id="list-empty" class="empty" hidden>Пока нет записей.<br>Первая — самая близкая ✍️</p>
      <p id="list-error" class="error" hidden></p>
    </section>

    <!-- Нижняя навигация -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-target="entry-screen" aria-label="Новая запись">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Запись</span>
      </button>
      <button class="nav-btn" data-target="list-screen" aria-label="Список записей">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
        <span>Список</span>
      </button>
    </nav>
  </main>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
